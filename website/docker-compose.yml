services:
  # ── Production: single container, single URL ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - CORS_ORIGINS=http://localhost:7860
    restart: unless-stopped

  # ── Development: hot-reload backend + Vite dev server ─────────────────────
  backend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: uvicorn backend.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/srv/backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174

  frontend-dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /fe
    volumes:
      - .:/fe
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://backend-dev:8000/api
    depends_on:
      - backend-dev
